        .gzy_nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-decoration: none;
            color: #999;
            transition: color 0.2s;
        }
        .gzy_nav-item.gzy_active {
            color: #ff6600;
        }
        .gzy_nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            fill: currentColor;
        }
        .gzy_nav-label {
            font-size: 11px;
        }
        .gzy_badge {
            position: absolute;
            top: 4px;
            right: calc(50% - 24px);
            min-width: 16px;
            height: 16px;
            background: #ff3b30;
            border-radius: 8px;
            color: #fff;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            font-style: normal;
        }
        .gzy_dot {
            position: absolute;
            top: 6px;
            right: calc(50% - 20px);
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
        }
