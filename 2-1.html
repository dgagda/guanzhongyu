<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h2>HTML元素:开始标签+内容+结束标记 </h2>
    <h3>内容与样式相分离</h3>
    <h4>山居秋瞑</h4>
    </p>空山新雨后</p>
    </p>天气晚来秋</p>
    <p>明月松间照</p>
    <p>清泉石上流</p>
    <h4>93阅兵展示的武器列表</h4>
    <ul>
        <li>东风</li>
        <li>鹰击</li>
        <li>长缨</li>
        <li>巨浪</li>
        <li>霹雳</li>
    </ul>
    <!-- 区域，块 -->
     <!-- 注释：ctrl+/ -->
      <div style="background-color: aqua;width: 400px;height: 200px;">
        盒子
        <div>
            <span style="column-rule-color: black;font-size: 60px;">管</span>
            <span style="color: brown;font-size: 60px">忠</span>
            <span style="color: gold;font-size: 60px">煜</span>
            <!-- 名字的每一个颜色都不一样 -->
             <!-- span 是行间元素，可以和其他元素在一行 -->

        </div>

      </div>
</body>
