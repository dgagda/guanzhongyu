<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管忠煜402</title>
</head>
<body>
    <h2>表单form</h2>
    <form action="https://www.huanqiu.com" name="yl"> 
        <p>用户名：<input type="text" name="username" placeholder="请输入用户名"></p>
        <p>密码：<input type="password" name="password" placeholder="请输入密码"></p> 
        <!-- 性别：男 女  保密 -->
        <p>性别：
            <label><input type="radio" name="sex" value="male" changed> 男</label>
            <label><input type="radio" name="sex" value="female"> 女</label>
            <label><input type="radio" name="sex" value="secret"> 保密</label>
        </p>
        <!-- 多选 -->
         <p>爱好：
            <label><input type="checkbox" name="hobbies" value="basketball"> 篮球</label>
            <label><input type="checkbox" name="hobbies" value="football"> 足球</label>
            <label><input type="checkbox" name="hobbies" value="badminton"> 羽毛球</label>
            <label><input type="checkbox" name="hobbies" value="table-tennis"> 乒乓球</label>
        </p>
        <!-- 籍贯 -->
        <p>籍贯：
            <select name="province">
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="guangdong">广东</option>
                <option value="jiangsu">江苏</option>
            </select>
            <p>
            
            <!-- 个人介绍 -->
            <p>个人介绍：
                <textarea name="introduction" placeholder="请输入个人介绍"></textarea>
            </p>
            <!-- 出生日期 -->
            <p>出生日期：
                <input type="date" name="birthdate">
            </p>
            <!-- 文件上传 -->
            <p>上传文件：
                <input type="file" name="file">
            
                    <!-- 按钮:普通按钮，提交按钮，重置按钮 -->
                     <input type="button" value="普通按钮">
                     <input type="submit" value="提交按钮">
                     <input type="reset" value="重置按钮">
                
            </p>
        </p>
    </form>
    <!-- 表单外的按钮 -->
     <button>按钮</button>
            
        


</body>
</html>
