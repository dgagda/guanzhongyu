<!DOCTYPE html>
<!-- 姓名：管忠煜，日期：2026-09-07，功能名称：CSS基础样式 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管忠煜</title>
    <style>
   h2 {
      color: white;
      background-color: black;
   }
    h3 { 
        color: red;

         }
         P {
             color: blue;
         }
         /* 标签选择器 ，选择器名称为标签*/
         #box{
            width: 500px;
            height: 500px;
            background-color:   #ccc;
         }/*  id选择器，以#开始，唯一 */
         .n1{
            color: red;
         }
         .n2{
            color: green;
         }
         .n3{
            color: blue;
         }
         .student-id {
            width: 200px;
            height: 80px;
            background-color: #9dd9e8;
            line-height: 80px;
            text-align: center;
         }

         </style>
</head>
<body>
    <h2>层叠样式表CSS3</h2>
    <div id="box">  
      <h3>CSS<span style="color: white;">选择器</span></h3>
      <p><span class="n1">管</span><span class="n2">忠</span><span class="n3">煜</span></p>
        <p>CSS属性</p>        
    </div>
   <div class="student-id">24002060402</div>
    <!-- 1 h2黑底白字
         2 名字不同颜色 在同一行
         3 选择器三个字是白色的
         4 新增一个盒子盒子的文字是学号 盒子有宽高背景 -->
</body>
</html>
