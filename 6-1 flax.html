<!DOCTYPE html>
<!-- 姓名：管忠煜，日期：2026-09-17，功能名称：Flex弹性布局 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin: 0;
        padding: 0;
       }
       .flex{
        display: flex;
        /* 容器，他的子元素在一行显示 */
        flex-wrap: wrap;
        justify-content: space-around;
       }
       .flex li{ 
        /* 项目，容器的子元素 */
        width: 20%;
        height: 200px;
        border: 1px solid #333;
        /* float: left; */
        list-style: none;
        display: grid;
        grid-template-columns: repeat(2, 70px);
        align-content: center;
        justify-content: center;
        gap: 8px;
       }
       .box{
        width: 70px;
        height: 70px;
        background-color: #f2f3f4;
        border: 1px solid #333;
        box-sizing: border-box;
       }
       .flex li:nth-child(1){
        /* 水平垂直对(齐 */
        align-items: center;
        justify-content: center;
       }
    .flex li:nth-child(3) .box:nth-child(3){
     grid-column: 1 / -1;
     width: 100%;
    }
    </style>
</head>
<body>
    <h2>管忠煜的flex</h2>
    <ul class="flex"> 
        <li><div class="box"></div> </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
    </ul>
</body>
</html>
