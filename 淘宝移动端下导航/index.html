<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘宝移动端下导航</title>
  <link rel="stylesheet" href="cdn/iconfont.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body>

  <a class="gzy_back" href="../index.html">← 返回课程首页</a>

  <!-- ===================== 模拟淘宝移动端商品流（对照截图） ===================== -->
  <div class="gzy_goods">
    <div class="gzy_card">
      <img class="gzy_card-img" src="images/kb.jpg" alt="小蜜蜂Made68ultra">
      <div class="gzy_card-info">
        <p class="gzy_card-title"><em>天猫</em>小蜜蜂Made68ultra</p>
        <p class="gzy_card-tip">双11官方立减15% 先用后付</p>
        <p class="gzy_card-price">¥369优惠后<span>全网热销400+</span></p>
      </div>
    </div>
    <div class="gzy_card">
      <img class="gzy_card-img" src="images/coat.jpg" alt="Jeep spirit美式复古针织开">
      <div class="gzy_card-info">
        <p class="gzy_card-title">Jeep spirit美式复古针织开</p>
        <p class="gzy_card-tip">双11官方立减15% 先用后付</p>
        <p class="gzy_card-price">¥168优惠后<span>已售100+</span></p>
      </div>
    </div>
    <div class="gzy_card">
      <img class="gzy_card-img" src="images/sp.jpg" alt="蓝牙音箱">
      <div class="gzy_card-info">
        <p class="gzy_card-title">无线蓝牙音箱 重低音</p>
        <p class="gzy_card-tip">双11狂欢价 到手省一半</p>
        <p class="gzy_card-price">¥22.9优惠后<span>已售2000+</span></p>
      </div>
    </div>
    <div class="gzy_banner">
      <img src="images/hw.jpg" alt="HUAWEI FreeBuds 7i">
      <p class="gzy_banner-title">HUAWEI FreeBuds 7i</p>
      <p class="gzy_banner-sub">智慧动态降噪40dB | 海阔天空配色 | 消噪智能耳机</p>
    </div>
  </div>

  <!-- ===================== 优惠券浮动条（对照截图，位于下导航上方） ===================== -->
  <div class="gzy_coupon">
    <span class="gzy_coupon-icon">¥</span>
    <span class="gzy_coupon-text">您有<b>4张共240元</b>消费券待领取</span>
    <button class="gzy_coupon-btn" type="button">领240元</button>
    <button class="gzy_coupon-close" type="button">✕</button>
  </div>

  <!-- ===================== 固定下导航（5项，iconfont 图标与原图完全一致） ===================== -->
  <nav class="gzy_nav">
    <a href="#" class="gzy_nav-item gzy_active">
      <i class="gzy_nav-icon iconfont icon-shejiaotubiao-44"></i>
      <span class="gzy_nav-label">淘宝</span>
    </a>
    <a href="#" class="gzy_nav-item">
      <i class="gzy_nav-icon iconfont icon-shipin"></i>
      <span class="gzy_nav-label">视频</span>
    </a><!--  -->

      <i class="gzy_nav-icon iconfont icon-xiaoxi2"></i>
      <span class="gzy_nav-label">消息</span>

    <a href="#" class="gzy_nav-item">
